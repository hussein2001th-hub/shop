<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة الديون</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
    
    :root {
      --primary: #3b82f6; 
      --danger: #ef4444; 
      --success: #10b981; 
      --whatsapp: #25D366;
      --bg: var(--tg-theme-secondary-bg-color, #f3f4f6);
      --card-bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1f2937);
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding-bottom: 90px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Header */
    .app-header {
      background-color: var(--card-bg);
      padding: 20px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      animation: slideDown 0.5s ease-out;
    }

    .total-debt-card {
      background: linear-gradient(135deg, var(--primary), #1d4ed8);
      color: white;
      border-radius: 20px;
      padding: 24px;
      margin-top: 15px;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
      position: relative;
      overflow: hidden;
    }
    .total-debt-card::after {
      content: '';
      position: absolute;
      top: -30px; left: -30px;
      width: 120px; height: 120px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }

    /* Grid Layout */
    .customers-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* شبكة من عمودين */
      gap: 12px;
      padding: 0 16px;
    }

    /* Cards & Animations */
    .customer-card {
      background-color: var(--card-bg);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      animation: slideUpFade 0.5s ease-out forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    
    .customer-card:active { transform: scale(0.96) !important; transition: 0.1s; }

    .avatar {
      width: 42px; height: 42px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800;
      margin-bottom: 10px;
    }
    .avatar-debt { background-color: #fee2e2; color: var(--danger); }
    .avatar-clear { background-color: #d1fae5; color: var(--success); }

    /* Action Buttons in Grid */
    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      border-top: 1px dashed rgba(156, 163, 175, 0.2);
      padding-top: 12px;
    }

    .action-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      border-radius: 10px;
      font-size: 14px;
      transition: 0.2s;
    }
    .btn-action { background-color: var(--bg); color: var(--text); }
    .btn-whatsapp { background-color: #dcfce3; color: var(--whatsapp); }

    /* FAB */
    .fab {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #10b981, #059669); color: white;
      padding: 14px 28px; border-radius: 30px; font-weight: bold; font-size: 15px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      display: flex; align-items: center; gap: 8px; z-index: 40;
      transition: 0.2s;
    }
    .fab:active { transform: translateX(-50%) scale(0.95); }

    /* Bottom Sheet Modal (الانتقالات الناعمة) */
    .overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 50;
      opacity: 0; pointer-events: none; transition: 0.3s;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    .bottom-sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top-left-radius: 24px; border-top-right-radius: 24px;
      padding: 24px; z-index: 60;
      transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 -5px 25px rgba(0,0,0,0.1);
    }
    .bottom-sheet.active { transform: translateY(0); }

    .input-field {
      width: 100%; padding: 14px; border-radius: 12px;
      border: 1px solid rgba(156, 163, 175, 0.3); background: var(--bg);
      color: var(--text); font-family: inherit; font-size: 16px; margin-bottom: 12px;
      outline: none; transition: 0.2s;
    }
    .input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

    .btn-submit {
      width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px;
      color: white; border: none; cursor: pointer; transition: 0.2s;
    }

    /* Keyframes */
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideDown {
      from { transform: translateY(-100%); }
      to { transform: translateY(0); }
    }
    .currency { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="app-header">
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-bold" id="greeting">دفتر الديون</h1>
    </div>
    
    <div class="total-debt-card">
      <p class="text-sm opacity-80 mb-1 font-medium">إجمالي أموالك في السوق</p>
      <h2 class="text-3xl font-bold flex items-center gap-2">
        <span id="total-debt" class="currency">0</span> 
        <span class="text-base font-normal opacity-80">دينار</span>
      </h2>
    </div>
  </div>

  <!-- Customers Grid -->
  <div id="customers-grid" class="customers-grid">
    <div class="col-span-2 text-center py-10 opacity-50 flex flex-col items-center">
      <svg class="animate-spin h-8 w-8 text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      <p class="text-sm font-bold">جاري تحميل الشبكة...</p>
    </div>
  </div>

  <!-- FAB Button -->
  <button class="fab" onclick="openAddCustomerSheet()">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    إضافة زبون
  </button>

  <!-- Bottom Sheet Overlay -->
  <div class="overlay" id="overlay" onclick="closeSheet()"></div>

  <!-- Bottom Sheet: Add / Pay Debt -->
  <div class="bottom-sheet" id="action-sheet">
    <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-5"></div>
    <h3 class="text-xl font-bold mb-4" id="sheet-title">تحديث الرصيد</h3>
    <input type="number" id="amount-input" class="input-field" placeholder="أدخل المبلغ بالدينار..." inputmode="numeric">
    <button class="btn-submit" id="submit-action-btn" onclick="submitAction()">تأكيد العملية</button>
  </div>

  <!-- Bottom Sheet: Add New Customer -->
  <div class="bottom-sheet" id="customer-sheet">
    <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-5"></div>
    <h3 class="text-xl font-bold mb-4">إضافة زبون جديد</h3>
    <input type="text" id="cust-name" class="input-field" placeholder="اسم الزبون...">
    <input type="tel" id="cust-phone" class="input-field" placeholder="رقم الهاتف..." inputmode="tel">
    <button class="btn-submit bg-green-500" onclick="submitNewCustomer()">حفظ الزبون</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('greeting').innerText = 'أهلاً ' + tg.initDataUnsafe.user.first_name;
    }
    tg.MainButton.hide();

    const firebaseConfig = {
      apiKey: "AIzaSyDWgACPpexFN4U7g4MtDxzLzP6CjuSwwvs",
      authDomain: "shopp-29149.firebaseapp.com",
      projectId: "shopp-29149",
      storageBucket: "shopp-29149.firebasestorage.app",
      messagingSenderId: "1149980878",
      appId: "1:1149980878:web:5863c83796c418c493409f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function formatMoney(amount) { return amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
    function getInitials(name) { return name.substring(0, 1).toUpperCase(); }

    function loadCustomers() {
      db.collection("customers").orderBy("createdAt", "desc").onSnapshot((querySnapshot) => {
        const grid = document.getElementById("customers-grid");
        grid.innerHTML = "";
        let totalDebt = 0;
        let delay = 0; // for stagger animation

        if (querySnapshot.empty) {
          grid.innerHTML = `<div class="col-span-2 text-center py-10 opacity-50"><p class="font-bold">لا يوجد زبائن</p></div>`;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const id = doc.id;
          totalDebt += data.balance;
          const isDebt = data.balance > 0;
          const statusText = isDebt ? "بذمته" : "خالص";
          const statusColor = isDebt ? "var(--danger)" : "var(--success)";
          
          grid.innerHTML += `
            <div class="customer-card" style="animation-delay: ${delay}s">
              <div>
                <div class="flex justify-between items-start">
                  <div class="avatar ${isDebt ? 'avatar-debt' : 'avatar-clear'}">${getInitials(data.name)}</div>
                  <button class="action-btn btn-whatsapp w-10 h-10 flex-none rounded-full" onclick="sendWhatsApp('${data.phone}', '${data.name}', ${data.balance})">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                  </button>
                </div>
                <h3 class="font-bold text-sm mt-1 truncate">${data.name}</h3>
                <span class="block font-bold text-lg currency mt-1" style="color: ${statusColor}">${formatMoney(data.balance)}</span>
                <span class="text-[11px] opacity-60 font-medium">${statusText}</span>
              </div>
              <div class="btn-group">
                <button class="action-btn btn-action" style="color: var(--danger)" onclick="openActionSheet('${id}', ${data.balance}, 'add')">
                  ➕ دين
                </button>
                <button class="action-btn btn-action" style="color: var(--success)" onclick="openActionSheet('${id}', ${data.balance}, 'pay')">
                  ➖ تسديد
                </button>
              </div>
            </div>
          `;
          delay += 0.05;
        });
        document.getElementById("total-debt").innerText = formatMoney(totalDebt);
      });
    }

    // --- Bottom Sheet Logic ---
    let currentDocId = '';
    let currentBalance = 0;
    let currentAction = '';

    function closeSheet() {
      document.getElementById('overlay').classList.remove('active');
      document.getElementById('action-sheet').classList.remove('active');
      document.getElementById('customer-sheet').classList.remove('active');
      document.getElementById('amount-input').value = '';
      document.getElementById('cust-name').value = '';
      document.getElementById('cust-phone').value = '';
    }

    function openActionSheet(id, balance, action) {
      tg.HapticFeedback.selectionChanged();
      currentDocId = id; currentBalance = balance; currentAction = action;
      
      const title = action === 'add' ? '➕ إضافة دين جديد' : '➖ تسديد دفعة';
      const btnColor = action === 'add' ? 'var(--danger)' : 'var(--success)';
      
      document.getElementById('sheet-title').innerText = title;
      document.getElementById('sheet-title').style.color = btnColor;
      document.getElementById('submit-action-btn').style.backgroundColor = btnColor;
      
      document.getElementById('overlay').classList.add('active');
      document.getElementById('action-sheet').classList.add('active');
      setTimeout(() => document.getElementById('amount-input').focus(), 300);
    }

    function submitAction() {
      const amount = parseFloat(document.getElementById('amount-input').value);
      if (isNaN(amount) || amount <= 0) {
        tg.HapticFeedback.notificationOccurred('error'); return alert('أدخل مبلغاً صحيحاً!');
      }
      tg.HapticFeedback.impactOccurred('medium');
      let newBal = currentAction === 'add' ? currentBalance + amount : currentBalance - amount;
      
      db.collection("customers").doc(currentDocId).update({ balance: newBal }).then(() => {
        tg.HapticFeedback.notificationOccurred('success');
        closeSheet();
      });
    }

    function openAddCustomerSheet() {
      tg.HapticFeedback.selectionChanged();
      document.getElementById('overlay').classList.add('active');
      document.getElementById('customer-sheet').classList.add('active');
      setTimeout(() => document.getElementById('cust-name').focus(), 300);
    }

    function submitNewCustomer() {
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      if (!name || !phone) {
        tg.HapticFeedback.notificationOccurred('error'); return alert('املأ جميع الحقول!');
      }
      tg.HapticFeedback.impactOccurred('medium');
      db.collection("customers").add({
        name: name, phone: phone, balance: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        tg.HapticFeedback.notificationOccurred('success');
        closeSheet();
      });
    }

    function sendWhatsApp(phone, name, balance) {
      if (balance <= 0) {
        tg.HapticFeedback.notificationOccurred('warning'); return alert("هذا الزبون خالص المديونية.");
      }
      tg.HapticFeedback.impactOccurred('light');
      let p = phone.startsWith('0') ? '+964' + phone.substring(1) : (!phone.startsWith('+') ? '+'+phone : phone);
      tg.openLink(`https://wa.me/${p}?text=${encodeURIComponent(`مرحباً ${name}، نود تذكيركم بأن الرصيد المتبقي هو ${formatMoney(balance)} دينار.`)}`);
    }

    loadCustomers();
  </script>
</body>
</html>
