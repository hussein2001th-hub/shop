<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة الديون</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
    
    :root {
      --primary: #3b82f6; 
      --danger: #ef4444; 
      --success: #10b981; 
      --whatsapp: #25D366;
      --bg: var(--tg-theme-secondary-bg-color, #f3f4f6);
      --card-bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1f2937);
      --muted: var(--tg-theme-hint-color, #6b7280);
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding-bottom: 80px; /* Space for Bottom Nav */
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Header */
    .app-header {
      background-color: var(--card-bg);
      padding: 20px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .total-debt-card {
      background: linear-gradient(135deg, var(--primary), #1d4ed8);
      color: white;
      border-radius: 20px;
      padding: 24px;
      margin-top: 15px;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
      position: relative;
      overflow: hidden;
    }
    .total-debt-card::after {
      content: '';
      position: absolute;
      top: -30px; left: -30px;
      width: 120px; height: 120px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }

    /* Single List Layout */
    .customers-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 16px;
    }

    .customer-card {
      background-color: var(--card-bg);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      animation: slideUpFade 0.4s ease-out forwards;
      opacity: 0;
    }
    
    .customer-card:active { transform: scale(0.98); transition: 0.1s; }

    .avatar {
      width: 46px; height: 46px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800;
    }
    .avatar-debt { background-color: #fee2e2; color: var(--danger); }
    .avatar-clear { background-color: #d1fae5; color: var(--success); }

    /* Action Buttons in List */
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      border-top: 1px dashed rgba(156, 163, 175, 0.3);
      padding-top: 16px;
    }

    .action-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      transition: 0.2s;
    }
    .action-btn svg { margin-bottom: 4px; }
    
    .btn-debt { background-color: #fee2e2; color: var(--danger); }
    .btn-pay { background-color: #d1fae5; color: var(--success); }
    .btn-whatsapp { background-color: #dcfce3; color: var(--whatsapp); }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
      z-index: 40;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      color: var(--muted); font-size: 12px; font-weight: bold;
      transition: 0.2s;
    }
    .nav-item.active { color: var(--primary); }
    .nav-item svg { margin-bottom: 4px; }

    /* Floating Action Button (FAB) slightly raised */
    .fab {
      position: absolute;
      top: -25px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      width: 50px; height: 50px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
      z-index: 45;
    }
    
    /* Sections */
    .section { display: none; animation: fadeIn 0.3s; }
    .section.active { display: block; }

    /* Settings UI */
    .settings-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin: 16px;
    }
    .setting-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(156,163,175,0.1);
    }
    .setting-item:last-child { border-bottom: none; }

    /* Bottom Sheet Modal */
    .overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 50;
      opacity: 0; pointer-events: none; transition: 0.3s;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    .bottom-sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top-left-radius: 24px; border-top-right-radius: 24px;
      padding: 24px; z-index: 60;
      transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 -5px 25px rgba(0,0,0,0.1);
    }
    .bottom-sheet.active { transform: translateY(0); }

    .input-field {
      width: 100%; padding: 14px; border-radius: 12px;
      border: 1px solid rgba(156, 163, 175, 0.3); background: var(--bg);
      color: var(--text); font-family: inherit; font-size: 16px; margin-bottom: 12px;
      outline: none; transition: 0.2s;
    }
    .input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

    .btn-submit {
      width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px;
      color: white; border: none; cursor: pointer;
    }

    @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .currency { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>

  <!-- ================= TAB: HOME ================= -->
  <div id="tab-home" class="section active">
    <!-- Header -->
    <div class="app-header">
      <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold" id="greeting">دفتر الديون</h1>
      </div>
      
      <div class="total-debt-card">
        <p class="text-sm opacity-80 mb-1 font-medium">إجمالي أموالك في السوق</p>
        <h2 class="text-3xl font-bold flex items-center gap-2">
          <span id="total-debt" class="currency">0</span> 
          <span class="text-base font-normal opacity-80" id="currency-label">دينار</span>
        </h2>
      </div>
    </div>

    <!-- Customers Single List -->
    <div id="customers-list" class="customers-list pb-6">
      <div class="text-center py-10 opacity-50 flex flex-col items-center">
        <svg class="animate-spin h-8 w-8 text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <p class="text-sm font-bold">جاري التحميل...</p>
      </div>
    </div>
  </div>

  <!-- ================= TAB: SETTINGS ================= -->
  <div id="tab-settings" class="section">
    <div class="app-header">
      <h1 class="text-2xl font-bold">الإعدادات</h1>
    </div>

    <div class="settings-card">
      <h3 class="font-bold text-lg mb-4 text-gray-500">معلومات الحساب</h3>
      <div class="setting-item">
        <span class="font-medium">عدد الزبائن الكلي</span>
        <span class="font-bold text-blue-600" id="stats-count">0</span>
      </div>
      <div class="setting-item">
        <span class="font-medium">العملة المفضلة</span>
        <select id="currency-selector" onchange="changeCurrency(this.value)" class="bg-gray-100 text-sm rounded-lg p-2 outline-none">
          <option value="دينار">دينار</option>
          <option value="$">دولار ($)</option>
          <option value="ريال">ريال</option>
        </select>
      </div>
    </div>

    <div class="settings-card mt-4">
      <h3 class="font-bold text-lg mb-4 text-gray-500">حول التطبيق</h3>
      <div class="setting-item">
        <span class="font-medium">الإصدار</span>
        <span class="opacity-70 text-sm">v2.0 (Telegram Mini App)</span>
      </div>
      <div class="setting-item">
        <span class="font-medium">قاعدة البيانات</span>
        <span class="text-green-500 text-sm font-bold">متصلة (Firebase)</span>
      </div>
    </div>
  </div>


  <!-- ================= BOTTOM NAVIGATION ================= -->
  <div class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="switchTab('home')">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      الرئيسية
    </div>
    
    <!-- Center Add Button -->
    <div style="position: relative; width: 50px; display: flex; justify-content: center;">
      <button class="fab" onclick="openAddCustomerSheet()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>

    <div class="nav-item" id="nav-settings" onclick="switchTab('settings')">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      الإعدادات
    </div>
  </div>

  <!-- Bottom Sheet Overlay -->
  <div class="overlay" id="overlay" onclick="closeSheet()"></div>

  <!-- Bottom Sheet: Add / Pay Debt -->
  <div class="bottom-sheet" id="action-sheet">
    <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-5"></div>
    <h3 class="text-xl font-bold mb-4" id="sheet-title">تحديث الرصيد</h3>
    <input type="number" id="amount-input" class="input-field" placeholder="أدخل المبلغ..." inputmode="numeric">
    <button class="btn-submit" id="submit-action-btn" onclick="submitAction()">تأكيد العملية</button>
  </div>

  <!-- Bottom Sheet: Add New Customer -->
  <div class="bottom-sheet" id="customer-sheet">
    <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-5"></div>
    <h3 class="text-xl font-bold mb-4">إضافة زبون جديد</h3>
    <input type="text" id="cust-name" class="input-field" placeholder="اسم الزبون كاملاً...">
    <input type="tel" id="cust-phone" class="input-field" placeholder="رقم الهاتف (مثل 077...)" inputmode="tel">
    <button class="btn-submit bg-green-500" onclick="submitNewCustomer()">حفظ الزبون</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.MainButton.hide();

    let userCurrency = localStorage.getItem("appCurrency") || "دينار";
    document.getElementById("currency-selector").value = userCurrency;
    document.getElementById("currency-label").innerText = userCurrency;

    function changeCurrency(val) {
      userCurrency = val;
      localStorage.setItem("appCurrency", val);
      document.getElementById("currency-label").innerText = val;
      loadCustomers(); // Reload to reflect new currency text
    }

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('greeting').innerText = 'أهلاً ' + tg.initDataUnsafe.user.first_name;
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDWgACPpexFN4U7g4MtDxzLzP6CjuSwwvs",
      authDomain: "shopp-29149.firebaseapp.com",
      projectId: "shopp-29149",
      storageBucket: "shopp-29149.firebasestorage.app",
      messagingSenderId: "1149980878",
      appId: "1:1149980878:web:5863c83796c418c493409f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function formatMoney(amount) { return amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
    function getInitials(name) { return name.substring(0, 1).toUpperCase(); }

    function switchTab(tabId) {
      document.getElementById('tab-home').classList.remove('active');
      document.getElementById('tab-settings').classList.remove('active');
      document.getElementById('nav-home').classList.remove('active');
      document.getElementById('nav-settings').classList.remove('active');

      document.getElementById(`tab-${tabId}`).classList.add('active');
      document.getElementById(`nav-${tabId}`).classList.add('active');
      tg.HapticFeedback.selectionChanged();
    }

    function loadCustomers() {
      db.collection("customers").orderBy("createdAt", "desc").onSnapshot((querySnapshot) => {
        const listDiv = document.getElementById("customers-list");
        listDiv.innerHTML = "";
        let totalDebt = 0;
        let count = 0;

        if (querySnapshot.empty) {
          listDiv.innerHTML = `<div class="text-center py-10 opacity-50"><p class="font-bold">لا يوجد زبائن حالياً</p></div>`;
        }

        querySnapshot.forEach((doc) => {
          count++;
          const data = doc.data();
          const id = doc.id;
          totalDebt += data.balance;
          const isDebt = data.balance > 0;
          const statusText = isDebt ? "عليه دين" : "الحساب خالص";
          const statusColor = isDebt ? "var(--danger)" : "var(--success)";
          
          // القائمة الواحدة الواضحة (Single List)
          listDiv.innerHTML += `
            <div class="customer-card">
              <div class="flex items-center gap-4">
                <div class="avatar ${isDebt ? 'avatar-debt' : 'avatar-clear'} flex-none">${getInitials(data.name)}</div>
                
                <div class="flex-1 min-w-0">
                  <h3 class="font-bold text-lg truncate">${data.name}</h3>
                  <p class="text-sm opacity-60 font-medium font-mono" dir="ltr" style="text-align: right;">${data.phone}</p>
                </div>

                <div class="text-left flex-none pl-2">
                  <span class="block font-bold text-xl currency" style="color: ${statusColor}">${formatMoney(data.balance)}</span>
                  <span class="text-xs opacity-60 font-medium">${statusText}</span>
                </div>
              </div>

              <div class="btn-group">
                <button class="action-btn btn-debt" onclick="openActionSheet('${id}', ${data.balance}, 'add')">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                  إضافة دين
                </button>
                <button class="action-btn btn-pay" onclick="openActionSheet('${id}', ${data.balance}, 'pay')">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                  تسديد دفعة
                </button>
                <button class="action-btn btn-whatsapp" onclick="sendWhatsApp('${data.phone}', '${data.name}', ${data.balance})">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                  تذكير بالواتساب
                </button>
              </div>
            </div>
          `;
        });
        document.getElementById("total-debt").innerText = formatMoney(totalDebt);
        document.getElementById("stats-count").innerText = count;
      });
    }

    // --- Bottom Sheet Logic ---
    let currentDocId = '';
    let currentBalance = 0;
    let currentAction = '';

    function closeSheet() {
      document.getElementById('overlay').classList.remove('active');
      document.getElementById('action-sheet').classList.remove('active');
      document.getElementById('customer-sheet').classList.remove('active');
      document.getElementById('amount-input').value = '';
      document.getElementById('cust-name').value = '';
      document.getElementById('cust-phone').value = '';
    }

    function openActionSheet(id, balance, action) {
      tg.HapticFeedback.selectionChanged();
      currentDocId = id; currentBalance = balance; currentAction = action;
      
      const title = action === 'add' ? '➕ إضافة دين جديد' : '➖ تسديد دفعة من الحساب';
      const btnColor = action === 'add' ? 'var(--danger)' : 'var(--success)';
      
      document.getElementById('sheet-title').innerText = title;
      document.getElementById('sheet-title').style.color = btnColor;
      document.getElementById('submit-action-btn').style.backgroundColor = btnColor;
      
      document.getElementById('overlay').classList.add('active');
      document.getElementById('action-sheet').classList.add('active');
      setTimeout(() => document.getElementById('amount-input').focus(), 300);
    }

    function submitAction() {
      const amount = parseFloat(document.getElementById('amount-input').value);
      if (isNaN(amount) || amount <= 0) {
        tg.HapticFeedback.notificationOccurred('error'); return alert('أدخل مبلغاً صحيحاً!');
      }
      tg.HapticFeedback.impactOccurred('medium');
      let newBal = currentAction === 'add' ? currentBalance + amount : currentBalance - amount;
      
      db.collection("customers").doc(currentDocId).update({ balance: newBal }).then(() => {
        tg.HapticFeedback.notificationOccurred('success');
        closeSheet();
      });
    }

    function openAddCustomerSheet() {
      tg.HapticFeedback.selectionChanged();
      document.getElementById('overlay').classList.add('active');
      document.getElementById('customer-sheet').classList.add('active');
      setTimeout(() => document.getElementById('cust-name').focus(), 300);
    }

    function submitNewCustomer() {
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      if (!name || !phone) {
        tg.HapticFeedback.notificationOccurred('error'); return alert('الرجاء كتابة الاسم والرقم!');
      }
      tg.HapticFeedback.impactOccurred('medium');
      db.collection("customers").add({
        name: name, phone: phone, balance: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        tg.HapticFeedback.notificationOccurred('success');
        closeSheet();
      });
    }

    function sendWhatsApp(phone, name, balance) {
      if (balance <= 0) {
        tg.HapticFeedback.notificationOccurred('warning'); return alert("لا يوجد دين على هذا الزبون للمطالبة به.");
      }
      tg.HapticFeedback.impactOccurred('light');
      let p = phone.startsWith('0') ? '+964' + phone.substring(1) : (!phone.startsWith('+') ? '+'+phone : phone);
      tg.openLink(`https://wa.me/${p}?text=${encodeURIComponent(`مرحباً ${name}،\nنود تذكيركم بلطف بأن الرصيد المتبقي في الحساب هو ${formatMoney(balance)} ${userCurrency}.\nشكراً لكم.`)}`);
    }

    loadCustomers();
  </script>
</body>
</html>
